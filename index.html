<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d35"><title>NETLAB | 네트워크관리사 학습실</title>
<style>
:root{--ink:#17243a;--muted:#77849a;--line:#e5eaf2;--paper:#f5f7fb;--navy:#101d35;--blue:#4263eb;--cyan:#22b8cf;--green:#2f9e44;--red:#e03131;--gold:#f59f00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}.layout{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}aside{background:var(--navy);color:white;padding:25px 16px;display:flex;flex-direction:column;gap:25px}.logo{display:flex;gap:12px;align-items:center;padding:0 10px}.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#748ffc,#22b8cf);display:grid;place-items:center;font-weight:900;font-size:20px}.logo strong{display:block;font-size:18px}.logo small{color:#a8b6ce}.navlabel{color:#7184a5;font-size:11px;font-weight:800;letter-spacing:1.4px;padding:0 12px;margin-bottom:6px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#b9c6da;text-align:left;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#233655;color:white}.ico{width:23px;text-align:center;font-size:17px}.side-note{margin-top:auto;border:1px solid #2c3d5a;border-radius:13px;padding:14px;color:#aab9d0;font-size:12px}.side-note strong{display:block;color:white;margin-bottom:5px}.main{min-width:0;padding:28px clamp(14px,3vw,42px) 55px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:11px;letter-spacing:1.4px;font-weight:900}.topbar h1{margin:3px 0 0;font-size:clamp(23px,3vw,31px);letter-spacing:-1px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;font-weight:750;color:var(--ink)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.soft{background:#edf2ff;color:#364fc7;border-color:#dbe4ff}.hero{background:linear-gradient(115deg,#18294a,#243e70 65%,#287d91);border-radius:20px;color:white;padding:28px;display:grid;grid-template-columns:1fr 150px;gap:18px;align-items:center}.hero h2{font-size:clamp(23px,3vw,32px);line-height:1.25;margin:10px 0}.hero p{color:#d5def0;max-width:620px;margin:0 0 18px}.hero-num{text-align:center}.hero-num b{display:block;font-size:42px;letter-spacing:-2px}.hero-num span{color:#d5def0;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}.metric,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.metric-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:750}.metric b{display:block;font-size:28px;margin:8px 0}.metric small{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:25px 0 13px}.section-head h2{font-size:18px;margin:0}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.exam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.exam-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:white;display:flex;flex-direction:column;gap:7px}.exam-card small{color:var(--muted)}.exam-card strong{font-size:16px}.exam-card .btn{margin-top:3px}.bar{height:8px;background:#edf0f6;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:20px}.muted{color:var(--muted)}.subject-row{display:grid;grid-template-columns:115px 1fr 40px;gap:10px;align-items:center;margin:14px 0;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:white;border:1px solid var(--line);padding:12px;border-radius:13px;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;background:white;padding:10px;color:var(--ink);min-width:125px}.toolbar input{flex:1;min-width:190px}.list{display:grid;gap:9px}.qrow{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.qrow strong{display:block;margin-bottom:4px}.qrow small{color:var(--muted)}.qactions{display:flex;gap:7px;align-items:center}.star{font-size:21px;color:var(--gold);background:#fff8e1;border-radius:8px;width:38px;height:38px}.empty{padding:40px 20px;text-align:center;color:var(--muted);background:white;border:1px dashed #d3dbe8;border-radius:14px}.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:15px;align-items:start}.question{background:white;border:1px solid var(--line);border-radius:16px;padding:clamp(15px,3vw,27px)}.qmeta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.question h2{font-size:21px;margin:17px 0}.source-images{display:grid;gap:10px}.source-images img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:7px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:20px}.choice{padding:14px 8px;border:1px solid var(--line);border-radius:10px;background:white;font-weight:800}.choice.selected{background:#edf2ff;border:2px solid var(--blue);color:#364fc7}.choice.correct{background:#ebfbee;border-color:var(--green);color:#2b8a3e}.choice.incorrect{background:#fff5f5;border-color:var(--red);color:var(--red)}.feedback{margin-top:15px;border-radius:11px;padding:13px;background:#f1f3f5}.good{background:#ebfbee;color:#2b8a3e}.bad{background:#fff5f5;color:#c92a2a}.quizside{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;position:sticky;top:15px}.quizside h3{font-size:14px;margin:0 0 12px}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.numbers button{aspect-ratio:1;border-radius:7px;background:#f1f3f8;color:#536078;font-size:12px}.numbers button.current{background:var(--blue);color:white}.numbers button.done{background:#d3f9d8;color:#2b8a3e}.side-stat{display:flex;justify-content:space-between;margin:12px 0;font-size:12px}.history-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.score{font-size:58px;font-weight:900;color:var(--blue);letter-spacing:-3px}.result{text-align:center;padding:35px 20px}.notice{background:#fff9db;border:1px solid #ffec99;padding:13px 15px;border-radius:11px;color:#7950f2;font-size:12px;margin-top:16px}.footer{margin-top:25px;color:var(--muted);font-size:11px;text-align:center}.loading{min-height:70vh;display:grid;place-items:center;text-align:center}.spinner{width:36px;height:36px;border:3px solid #dbe4ff;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17243a;color:white;padding:12px 18px;border-radius:10px;z-index:10}
@media(max-width:1000px){.layout{grid-template-columns:72px minmax(0,1fr)}aside{padding:20px 8px;align-items:center}.logo strong,.logo small,.navlabel,.nav button .label,.side-note{display:none}.nav{width:100%}.nav button{justify-content:center;padding:12px 0}.ico{width:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.exam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quiz-layout{grid-template-columns:minmax(0,1fr) 200px}}
@media(max-width:700px){.layout{display:block;padding-bottom:65px}aside{position:fixed;z-index:5;bottom:0;left:0;right:0;height:62px;flex-direction:row;padding:5px 8px;gap:3px;justify-content:space-around;box-shadow:0 -5px 20px #10203b18}.logo,.side-note{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{display:grid;justify-items:center;gap:1px;flex:1;padding:5px 2px;font-size:10px}.ico{font-size:17px}.nav button .label{display:block}.main{padding:18px 12px 30px}.topbar{align-items:flex-start}.topbar .btn{padding:8px;font-size:12px}.hero{grid-template-columns:1fr;padding:22px}.hero-num{display:none}.cards{gap:9px}.metric{padding:13px}.metric b{font-size:24px}.two{grid-template-columns:1fr}.exam-grid{grid-template-columns:1fr 1fr}.quiz-layout{grid-template-columns:1fr}.quizside{position:static;order:-1}.numbers{grid-template-columns:repeat(10,1fr)}.numbers button{aspect-ratio:1.3}.choices{gap:6px}.choice{padding:12px 3px}.qrow{padding:11px}.qactions{flex-direction:column}.subject-row{grid-template-columns:85px 1fr 35px}}
</style></head><body><div id="app"><div class="loading"><div><div class="spinner"></div><strong>문제은행을 불러오는 중입니다.</strong><p class="muted">첫 접속은 데이터 크기에 따라 시간이 걸릴 수 있습니다.</p></div></div></div>
<script>
(function(){
'use strict';const BANK_URL='./data/bank.json',STORE='netlab_sup_v2',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('sv-SE');
const fresh=()=>({progress:{},bookmarks:[],history:[],days:[]});let state=readState(),bank=null,view='home',filters={year:'all',exam:'all',subject:'all',status:'all',text:''},ids=[],idx=0,chosen={},checked={},mode='practice',sessionTitle='',toastTimer;
function readState(){try{const x=JSON.parse(localStorage.getItem(STORE));return x&&x.progress&&Array.isArray(x.bookmarks)?{...fresh(),...x}:fresh()}catch{return fresh()}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{notify('저장 공간이 부족합니다. 기록을 백업해 주세요.')}}
function notify(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.append(el)}el.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2800)}
const qs=()=>bank?.questions||[],exams=()=>bank?.exams||[],examFor=q=>exams().find(e=>e.id===q.exam)||{},progress=id=>state.progress[id]||{},attempts=()=>Object.values(state.progress).reduce((n,p)=>n+(p.attempts||0),0),correctCount=()=>Object.values(state.progress).reduce((n,p)=>n+(p.correct||0),0),pct=(n,d)=>d?Math.round(n/d*100):0,wrongIds=()=>qs().filter(q=>progress(q.id).attempts&&progress(q.id).lastCorrect===false).map(q=>q.id);
function nav(id,icon,label){return '<button class="'+(view===id?'active':'')+'" data-view="'+id+'"><span class="ico">'+icon+'</span><span class="label">'+label+'</span></button>'}
function shell(title,content){$('#app').innerHTML='<div class="layout"><aside><div class="logo"><div class="mark">N</div><div><strong>NETLAB</strong><small>NETWORK STUDY</small></div></div><div style="width:100%"><div class="navlabel">STUDY SPACE</div><nav class="nav">'+nav('home','▦','대시보드')+nav('bank','▤','문제은행')+nav('wrong','↻','오답노트')+nav('bookmarks','☆','북마크')+nav('stats','◷','학습기록')+'</nav></div><div class="side-note"><strong>네트워크관리사 2급</strong>이 저장소에 보관된 문제 데이터를 사용하는 독립 학습 화면입니다. 기록은 이 브라우저에 저장됩니다.</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">NETWORK ADMINISTRATOR · LEVEL 2</div><h1>'+title+'</h1></div><div class="actions"><button class="btn" id="export">기록 백업</button><button class="btn" id="importBtn">복원</button><input id="importFile" type="file" accept="application/json" hidden></div></header>'+content+'<div class="footer">NETLAB Study · 기록은 현재 브라우저에 저장됩니다. 문제 데이터 출처: NA2-study</div></main></div>';}
function home(){const q=qs(),done=q.filter(x=>progress(x.id).attempts).length,subjects=[...new Set(q.map(x=>x.subject).filter(Boolean))],recent=exams().slice().reverse().slice(0,6);return '<section class="hero"><div><div class="eyebrow" style="color:#9fe8f2">YOUR NEXT LEVEL STARTS HERE</div><h2>기출문제로 완성하는<br>네트워크 실력</h2><p>회차별로 풀고, 오답을 다시 확인하며 나만의 학습 기록을 쌓아보세요.</p><button class="btn" id="daily">미풀이 우선 10문제 시작 →</button></div><div class="hero-num"><b>'+q.length.toLocaleString()+'</b><span>문제은행 문항</span></div></section><div class="cards">'+[['누적 풀이',attempts(),'총 시도 횟수'],['정답률',pct(correctCount(),attempts())+'%',correctCount()+'회 정답'],['복습할 오답',wrongIds().length,'최근 답안 기준'],['북마크',state.bookmarks.length,'다시 볼 문항']].map(a=>'<div class="metric"><div class="metric-head">'+a[0]+'</div><b>'+a[1]+'</b><small>'+a[2]+'</small></div>').join('')+'</div><div class="two"><section><div class="section-head"><div><h2>회차별 빠른 시작</h2><p>회차를 골라 연습하거나 실전형으로 풀기</p></div><button class="btn" data-view="bank">전체 보기</button></div><div class="exam-grid">'+recent.map(e=>'<article class="exam-card"><small>'+e.year+'년 · '+esc(e.date||'기출 회차')+'</small><strong>제'+e.round+'회</strong><small>'+q.filter(x=>x.exam===e.id).length+'문항</small><button class="btn primary" data-exam="'+esc(e.id)+'">회차 연습</button><button class="btn" data-exam="'+esc(e.id)+'" data-mode="exam">실전형 시작</button></article>').join('')+'</div></section><section><div class="section-head"><div><h2>학습 진행률</h2><p>한 번 이상 풀어본 문항</p></div><strong>'+pct(done,q.length)+'%</strong></div><div class="panel"><div class="bar"><span style="width:'+pct(done,q.length)+'%"></span></div><p class="muted" style="font-size:12px">'+done.toLocaleString()+' / '+q.length.toLocaleString()+'문항 학습 완료</p><div class="section-head"><h2 style="font-size:15px">과목별 풀이 현황</h2></div>'+subjects.map(s=>{let sub=q.filter(x=>x.subject===s),n=sub.filter(x=>progress(x.id).attempts).length;return '<div class="subject-row"><span>'+esc(s)+'</span><div class="bar"><span style="width:'+pct(n,sub.length)+'%"></span></div><strong>'+pct(n,sub.length)+'%</strong></div>'}).join('')+'</div></section></div><div class="notice">문제은행 파일은 이 저장소의 data/bank.json에 있습니다. 첫 접속 시 파일을 내려받을 수 있으며 이후 브라우저 캐시를 사용할 수 있습니다. 원문 이미지에 해설 텍스트가 별도로 없는 문항은 정답 번호를 표시합니다.</div>'}
function filtered(){let query=filters.text.trim().toLowerCase().replace(/\s/g,'');return qs().filter(q=>{let e=examFor(q),p=progress(q.id),st=filters.status;return(filters.year==='all'||String(e.year)===filters.year)&&(filters.exam==='all'||q.exam===filters.exam)&&(filters.subject==='all'||q.subject===filters.subject)&&(st==='all'||(st==='wrong'&&p.attempts&&p.lastCorrect===false)||(st==='bookmark'&&state.bookmarks.includes(q.id))||(st==='unseen'&&!p.attempts)||(st==='correct'&&p.lastCorrect===true))&&(!query||String(q.text||q.title||'').toLowerCase().replace(/\s/g,'').includes(query)||String(q.id).toLowerCase().includes(query))})}
function bankView(){let ys=[...new Set(exams().map(e=>e.year))].sort((a,b)=>b-a),subs=[...new Set(qs().map(q=>q.subject).filter(Boolean))],list=filtered().slice(0,250);return '<div class="section-head"><div><h2>전체 문제은행</h2><p>'+filtered().length.toLocaleString()+'문항 · 한 화면 최대 250개 표시</p></div><button class="btn primary" id="startFiltered">검색 결과 풀기</button></div><div class="toolbar"><input id="search" placeholder="문제 내용 또는 문항 ID 검색" value="'+esc(filters.text)+'"><select id="year"><option value="all">전체 연도</option>'+ys.map(y=>'<option value="'+y+'" '+(String(y)===filters.year?'selected':'')+'>'+y+'</option>').join('')+'</select><select id="exam"><option value="all">전체 회차</option>'+exams().slice().reverse().map(e=>'<option value="'+esc(e.id)+'" '+(filters.exam===e.id?'selected':'')+'>'+e.year+'년 제'+e.round+'회</option>').join('')+'</select><select id="subject"><option value="all">전체 과목</option>'+subs.map(s=>'<option value="'+esc(s)+'" '+(filters.subject===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select><select id="status"><option value="all">전체 상태</option><option value="unseen" '+(filters.status==='unseen'?'selected':'')+'>미풀이</option><option value="wrong" '+(filters.status==='wrong'?'selected':'')+'>최근 오답</option><option value="correct" '+(filters.status==='correct'?'selected':'')+'>최근 정답</option><option value="bookmark" '+(filters.status==='bookmark'?'selected':'')+'>북마크</option></select></div><div class="list">'+(list.length?list.map(q=>{let e=examFor(q),p=progress(q.id);return '<article class="qrow"><div><strong>'+e.year+'년 제'+e.round+'회 · '+esc(q.subject||'과목 미분류')+' · '+q.number+'번</strong><small>'+(p.attempts?'최근 '+(p.lastCorrect?'정답':'오답')+' · '+p.attempts+'회 풀이':'미풀이')+' · '+esc(q.title||q.id).slice(0,90)+'</small></div><div class="qactions"><button class="star" data-star="'+esc(q.id)+'">'+(state.bookmarks.includes(q.id)?'★':'☆')+'</button><button class="btn primary" data-single="'+esc(q.id)+'">풀기</button></div></article>'}).join(''):'<div class="empty">조건에 맞는 문항이 없습니다.</div>')+'</div>'}
function review(which){let set=which==='wrong'?wrongIds():state.bookmarks,list=qs().filter(q=>set.includes(q.id));return '<div class="section-head"><div><h2>'+(which==='wrong'?'다시 확인할 오답':'저장한 북마크')+'</h2><p>'+list.length+'문항</p></div><button class="btn primary" id="startFiltered">전체 이어 풀기</button></div><div class="list">'+(list.length?list.map(q=>{let e=examFor(q),p=progress(q.id);return '<article class="qrow"><div><strong>'+e.year+'년 제'+e.round+'회 · '+esc(q.subject)+' · '+q.number+'번</strong><small>'+(p.attempts?'최근 '+(p.lastCorrect?'정답':'오답')+' · '+p.attempts+'회 풀이':'미풀이')+'</small></div><div class="qactions"><button class="star" data-star="'+esc(q.id)+'">'+(state.bookmarks.includes(q.id)?'★':'☆')+'</button><button class="btn primary" data-single="'+esc(q.id)+'">다시 풀기</button></div></article>'}).join(''):'<div class="empty">아직 문항이 없습니다.</div>')+'</div>'}
function stats(){let h=state.history.slice(0,30);return '<div class="cards">'+[['풀이 시도',attempts()],['정답',correctCount()],['정답률',pct(correctCount(),attempts())+'%'],['학습한 날',state.days.length]].map(a=>'<div class="metric"><div class="metric-head">'+a[0]+'</div><b>'+a[1]+'</b></div>').join('')+'</div><div class="panel"><div class="section-head"><div><h2>최근 학습 기록</h2><p>이 브라우저에 저장된 세션</p></div><button class="btn" id="clearHistory">기록 초기화</button></div>'+(h.length?h.map(x=>'<div class="history-row"><div><strong>'+esc(x.title)+'</strong><br><small class="muted">'+new Date(x.date).toLocaleString('ko-KR')+'</small></div><div style="text-align:right"><strong>'+x.correct+'/'+x.total+'</strong><br><small class="muted">'+pct(x.correct,x.total)+'%</small></div></div>').join(''):'<div class="empty">완료한 학습 기록이 없습니다.</div>')+'</div><div class="notice">기록은 현재 브라우저에만 저장됩니다. 다른 기기로 옮기려면 상단의 기록 백업 기능을 사용하세요.</div>'}
function quiz(){let q=qs().find(x=>x.id===ids[idx]);if(!q){view='home';return home()}let e=examFor(q),ans=chosen[q.id],done=!!checked[q.id],right=ans===q.answer;return '<div class="quiz-head"><div><div class="eyebrow">'+esc(sessionTitle)+'</div><strong>'+(idx+1)+' / '+ids.length+'문항</strong></div><div class="actions"><button class="btn" id="quit">나가기</button><button class="btn primary" id="finish">학습 종료</button></div></div><div class="quiz-layout"><section class="question"><div class="qmeta"><span>'+e.year+'년 제'+e.round+'회 · '+esc(q.subject||'과목 미분류')+'</span><button class="btn '+(state.bookmarks.includes(q.id)?'soft':'')+'" id="quizStar">'+(state.bookmarks.includes(q.id)?'★ 북마크':'☆ 북마크')+'</button></div><h2>'+q.number+'번 문항</h2><div class="source-images">'+(q.images||[]).map((im,i)=>'<img loading="lazy" src="'+im+'" alt="기출문제 원문 '+(i+1)+'">').join('')+'</div><div class="choices">'+[1,2,3,4].map(n=>'<button class="choice '+(ans===n?'selected ':'')+(done&&n===q.answer?'correct ':'')+(done&&ans===n&&!right?'incorrect':'')+'" data-choice="'+n+'" '+(done?'disabled':'')+'>'+n+'번</button>').join('')+'</div>'+(done?'<div class="feedback '+(right?'good':'bad')+'"><strong>'+(right?'정답입니다!':'오답입니다.')+'</strong><div>정답: '+q.answer+'번</div></div>':'')+'<div class="section-head"><button class="btn" id="prev" '+(idx===0?'disabled':'')+'>← 이전</button><div class="actions">'+(mode==='practice'?'<button class="btn primary" id="check" '+(!ans?'disabled':'')+'>정답 확인</button>':'')+'<button class="btn primary" id="next">'+(idx===ids.length-1?'결과 보기':'다음 문항 →')+'</button></div></div></section><aside class="quizside"><h3>문항 이동</h3><div class="numbers">'+ids.map((id,i)=>'<button class="'+(i===idx?'current ':'')+(checked[id]?'done':'')+'" data-jump="'+i+'">'+(i+1)+'</button>').join('')+'</div><div class="side-stat"><span class="muted">선택 완료</span><strong>'+Object.keys(chosen).filter(id=>ids.includes(id)).length+' / '+ids.length+'</strong></div><div class="side-stat"><span class="muted">정답 확인</span><strong>'+Object.keys(checked).filter(id=>ids.includes(id)).length+'문항</strong></div><div class="bar"><span style="width:'+pct(idx+1,ids.length)+'%"></span></div><p class="muted" style="font-size:11px">실전형 세션은 학습용입니다. 공식 시험 감독 기능은 없습니다.</p></aside></div>'}
function result(){let x=state.history[0]||{correct:0,total:0,title:'학습 세션'};return '<section class="panel result"><div class="eyebrow">SESSION COMPLETE</div><h2>학습을 마쳤습니다</h2><div class="score">'+x.correct+'<span style="font-size:22px;color:#77849a"> / '+x.total+'</span></div><p class="muted">정답률 '+pct(x.correct,x.total)+'% · '+esc(x.title)+'</p><div class="actions" style="justify-content:center;margin-top:20px"><button class="btn primary" id="retryWrong">오답 다시 풀기</button><button class="btn" data-view="bank">문제은행으로</button><button class="btn" data-view="home">대시보드</button></div></section>'}
function render(){if(!bank)return;let title={home:'학습 대시보드',bank:'문제은행',wrong:'오답노트',bookmarks:'북마크',stats:'학습 기록',quiz:'문제 풀이',result:'학습 결과'}[view]||'학습실',content=view==='home'?home():view==='bank'?bankView():view==='wrong'?review('wrong'):view==='bookmarks'?review('bookmarks'):view==='stats'?stats():view==='quiz'?quiz():result();shell(title,content);bind()}
function start(list,m,title){if(!list.length){notify('풀 문제가 없습니다.');return}ids=list;idx=0;chosen={};checked={};mode=m;sessionTitle=title;view='quiz';render()}
function record(id,n){let q=qs().find(x=>x.id===id),p=progress(id);if(!q)return;state.progress[id]={attempts:(p.attempts||0)+1,correct:(p.correct||0)+(n===q.answer?1:0),lastCorrect:n===q.answer,lastChoice:n};if(!state.days.includes(today()))state.days.push(today());save()}
function finishSession(){let n=0,total=0;ids.forEach(id=>{if(chosen[id]){total++;if(chosen[id]===qs().find(q=>q.id===id)?.answer)n++;if(!checked[id])record(id,chosen[id])}});state.history.unshift({id:'s'+Date.now(),title:sessionTitle,date:new Date().toISOString(),total:ids.length,correct:n,answered:total});state.history=state.history.slice(0,200);save();view='result';render()}
function toggleStar(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();render()}
function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='NETLAB-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)}
async function restore(){let f=$('#importFile').files[0];$('#importFile').value='';if(!f)return;try{if(f.size>5*1024*1024)throw Error('백업 파일은 5MB 이하여야 합니다.');let x=JSON.parse(await f.text());if(!x.progress||!Array.isArray(x.bookmarks)||!Array.isArray(x.history))throw Error('지원하지 않는 백업 파일입니다.');if(confirm('현재 학습 기록을 백업 파일로 교체할까요?')){state={...fresh(),...x};save();render();notify('학습 기록을 복원했습니다.')}}catch(e){notify(e.message||'파일을 읽을 수 없습니다.')}}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#export').onclick=backup;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=restore;document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start(qs().filter(q=>q.exam===b.dataset.exam).map(q=>q.id),b.dataset.mode||'practice',b.dataset.mode==='exam'?'실전형 세션':'회차 연습'));document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>toggleStar(b.dataset.star));document.querySelectorAll('[data-single]').forEach(b=>b.onclick=()=>start([b.dataset.single],'practice','개별 문항 학습'));if($('#daily'))$('#daily').onclick=()=>{let a=qs().filter(q=>!progress(q.id).attempts),b=qs().filter(q=>progress(q.id).attempts),shuffle=x=>[...x].sort(()=>Math.random()-.5);start([...shuffle(a),...shuffle(b)].slice(0,10).map(q=>q.id),'practice','미풀이 우선 10문항')};if($('#search')){['search','year','exam','subject','status'].forEach(id=>$('#'+id).onchange=()=>{filters[id==='search'?'text':id]=$('#'+id).value;render()});$('#search').oninput=()=>{filters.text=$('#search').value;let pos=$('#search').selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}}if($('#startFiltered'))$('#startFiltered').onclick=()=>start((view==='wrong'?wrongIds():view==='bookmarks'?state.bookmarks:filtered().map(q=>q.id)),'practice',view==='wrong'?'오답 복습':view==='bookmarks'?'북마크 복습':'검색 결과 연습');if($('#clearHistory'))$('#clearHistory').onclick=()=>{if(confirm('학습 기록과 북마크를 초기화할까요?')){state=fresh();save();render()}};if($('#quizStar'))$('#quizStar').onclick=()=>toggleStar(ids[idx]);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{chosen[ids[idx]]=Number(b.dataset.choice);render()});if($('#check'))$('#check').onclick=()=>{let q=qs().find(x=>x.id===ids[idx]);if(chosen[q.id]){checked[q.id]=true;record(q.id,chosen[q.id]);render()}};if($('#prev'))$('#prev').onclick=()=>{idx--;render()};if($('#next'))$('#next').onclick=()=>idx===ids.length-1?finishSession():(idx++,render());if($('#finish'))$('#finish').onclick=()=>{if(confirm('현재 답안으로 학습을 종료할까요?'))finishSession()};if($('#quit'))$('#quit').onclick=()=>{if(confirm('대시보드로 이동할까요?')){view='home';render()}};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{idx=Number(b.dataset.jump);render()});if($('#retryWrong'))$('#retryWrong').onclick=()=>start(wrongIds(),'practice','오답 복습')}
async function boot(){try{let r=await fetch(BANK_URL,{cache:'force-cache'});if(!r.ok)throw Error('문제은행 요청 실패 ('+r.status+')');bank=JSON.parse(await r.text());if(!Array.isArray(bank.questions)||!Array.isArray(bank.exams))throw Error('문제은행 형식이 올바르지 않습니다.');render()}catch(e){$('#app').innerHTML='<main class="main"><section class="panel" style="margin:10vh auto;max-width:650px"><div class="eyebrow">DATA CONNECTION</div><h1>문제은행을 불러오지 못했습니다.</h1><p>'+esc(e.message)+'</p><p class="muted">인터넷 연결을 확인하고 다시 시도해 주세요.</p><button class="btn primary" onclick="location.reload()">다시 시도</button><p class="muted" style="font-size:12px">저장소 내부 데이터 파일: data/bank.json</p></section></main>'}}boot();
})();
</script></body></html>
